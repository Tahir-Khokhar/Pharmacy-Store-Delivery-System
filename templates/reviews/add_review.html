{% extends 'base.html' %}

{% block title %}Review {{ product.name }} - PharmaCare{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <h4 class="fw-bold text-dark mb-1"><i class="bi bi-star-fill text-warning me-2"></i> Product Feedback</h4>
        <p class="text-muted small mb-4">Share your verified patient/customer feedback on <strong>{{ product.name }}</strong></p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Overall Rating</label>
            {{ form.rating }}
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Your Review &amp; Experience</label>
            {{ form.review }}
          </div>

          <div class="d-flex justify-content-between">
            <a href="{% url 'products:product_detail' product.slug %}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-teal px-4 fw-semibold">Submit Review</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
